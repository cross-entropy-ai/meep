name: Release

# Builds, signs and notarizes Meep. With "publish", also creates the tag v<CFBundleShortVersionString>
# and the GitHub release (zip, Homebrew cask meep.rb, checksums.txt) as github-actions[bot];
# cross-entropy-ai/homebrew-tap picks up meep.rb. Without it, the files are kept as an artifact.
#   gh workflow run release.yml -f publish=true -f notes="$(cat notes.md)"
#
# Secrets: DEVELOPER_ID_P12 (base64 of the "Developer ID Application" identity exported as .p12),
#          DEVELOPER_ID_P12_PASSWORD, NOTARY_APPLE_ID, NOTARY_PASSWORD (app-specific password).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create the tag and the GitHub release
        type: boolean
        default: false
      notes:
        description: Release notes (Markdown)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Info.plist)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ] && gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::v$version is already released; bump CFBundleShortVersionString"; exit 1
          fi

      - name: Toolchain
        run: |
          brew install meson ninja
          swiftc --version

      # WebRTC and ffmpeg take a while to build; rebuilt only when their scripts change.
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-webrtc.sh', 'scripts/build-ffmpeg.sh') }}

      - name: Import the signing identity
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$pw" "$RUNNER_TEMP/signing.keychain-db"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/id.p12"
          # Intermediate certificate, in case the runner image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$RUNNER_TEMP/signing.keychain-db" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$RUNNER_TEMP/signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db"

      - name: Build, sign and notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: P9772KLZBG
        run: scripts/release.sh build/release

      - uses: actions/upload-artifact@v4
        with:
          name: meep-release
          path: build/release/*

      - name: Publish the release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" build/release/* --target "$GITHUB_SHA" \
            --title "Meep $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
